<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="240" fill="#0f1115"/>

  <!-- left panel: hidden in overflow -->
  <text x="190" y="30" fill="#e6e6e6" font-size="15" text-anchor="middle">Hidden in the overflow</text>
  <rect x="40" y="150" width="300" height="56" rx="6" fill="#15181f" stroke="#2b3140"/>
  <g fill="#3a4150">
    <rect x="60" y="166" width="26" height="26" rx="4"/>
    <rect x="96" y="166" width="26" height="26" rx="4"/>
    <rect x="132" y="166" width="26" height="26" rx="4"/>
  </g>
  <text x="300" y="185" fill="#8b93a1" font-size="22" text-anchor="middle">^</text>
  <!-- callout to overflow -->
  <rect x="250" y="70" width="70" height="70" rx="8" fill="#1b1f27" stroke="#2b3140"/>
  <g>
    <rect x="277" y="82" width="16" height="28" rx="5" fill="#0a0c10" stroke="#3a4150"/>
    <circle cx="285" cy="90" r="4" fill="#37d67a"/>
    <circle cx="285" cy="102" r="4" fill="#e5484d"/>
  </g>
  <polyline points="285,140 285,150 296,150" fill="none" stroke="#5b6472" stroke-width="2"/>
  <text x="190" y="128" fill="#8b93a1" font-size="12" text-anchor="middle">new icons land here by default</text>

  <!-- right panel: promoted -->
  <text x="570" y="30" fill="#e6e6e6" font-size="15" text-anchor="middle">Pinned to the taskbar</text>
  <rect x="420" y="150" width="300" height="56" rx="6" fill="#15181f" stroke="#2b3140"/>
  <g fill="#3a4150">
    <rect x="440" y="166" width="26" height="26" rx="4"/>
    <rect x="476" y="166" width="26" height="26" rx="4"/>
  </g>
  <!-- promoted traffic light on the bar -->
  <g>
    <rect x="512" y="162" width="18" height="32" rx="5" fill="#0a0c10" stroke="#3a4150"/>
    <circle cx="521" cy="171" r="4.5" fill="#37d67a"/>
    <circle cx="521" cy="184" r="4.5" fill="#e5484d"/>
  </g>
  <text x="570" y="128" fill="#8b93a1" font-size="12" text-anchor="middle">drag it out once, or it auto-pins</text>

  <!-- arrow between panels -->
  <line x1="345" y1="100" x2="410" y2="100" stroke="#37d67a" stroke-width="2"/>
  <polyline points="402,93 410,100 402,107" fill="none" stroke="#37d67a" stroke-width="2"/>
</svg>